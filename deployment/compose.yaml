services:
  classification:
    image: amarilo-classification:local
    init: true
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deployment/api/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      MODEL_PATH: /app/deployment/model/model.joblib
    volumes:
      - type: bind
        source: ./model
        target: /app/deployment/model
        read_only: true
        bind:
          create_host_path: false
